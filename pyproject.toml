[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-datacenter-facility"
version = "0.1.0"
description = "Reproducible building-only data center concept engineering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jonathan Oktaviano"}]
dependencies = []

[project.scripts]
dcf = "dcf.cli:main"

[tool.setuptools]
packages = ["dcf"]
