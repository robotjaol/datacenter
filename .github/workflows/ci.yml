name: Verify facility models
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  models:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m dcf.cli validate
      - run: python -m dcf.cli run --output build/ci
      - run: python scripts/verify_repository.py
